name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: aarc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python conformance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jsonschema>=4.23,<5" "pytest>=8,<9" "matplotlib>=3.9,<4" "rfc8785==0.1.4"

      - name: Install TypeScript conformance dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify normative schemas and positive fixture
        run: ./scripts/verify_schema.sh

      - name: Run Python conformance suite
        run: pytest -q

      - name: Run adversarial conformance benchmark
        run: |
          mkdir -p dist
          python evaluation/run_conformance_benchmark.py | tee dist/conformance-results.json

      - name: Run performance scaling benchmark
        run: python evaluation/run_performance_benchmark.py | tee dist/performance-results.json

      - name: Compile and test TypeScript reference implementation
        run: npm run test:ts

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            zip

      - name: Build publication PDF
        run: ./scripts/build_pdf.sh

      - name: Build arXiv bundle
        run: ./scripts/make_arxiv_zip.sh

      - name: Upload conformance evidence
        uses: actions/upload-artifact@v4
        with:
          name: aarc-v1.1.0-conformance
          path: |
            dist/conformance-results.json
            dist/performance-results.json

      - name: Upload publication artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aarc-v1.1.0-publication
          path: |
            paper/main.pdf
            dist/AARC_v1_1_0_arxiv.zip
